[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --cov по коду бота: tests/ в отчёт не входят, иначе цифра раздута
# покрытием самих тестов. Краткий отчёт по модулям — в каждом прогоне;
# непокрытые строки: pytest --cov-report=term-missing
addopts = -q --strict-markers --cov=quantum --cov=script --cov-report=term
filterwarnings =
    ignore::DeprecationWarning
