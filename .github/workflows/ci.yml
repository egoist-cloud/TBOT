# CI для проекта Quantum (TBOT).
#
# Что проверяем:
#   1) ruff — ошибки, которые обычно находит pyflakes (неиспользуемые
#      импорты, неопределённые имена), плюс bugbear и asyncio.
#   2) pytest — тесты: утечка cookie на сторонние хосты, маскирование
#      секретов в логах, атомарность голосования, единый app_id заявки,
#      миграции БД.
#   3) pip-audit — в requirements.txt нет пакетов с известными уязвимостями
#      (CVE/GHSA из PyPI advisory и OSV).
#   4) bandit — в коде нет очевидно опасных конструкций уровня medium+:
#      shell=True, eval/exec, хардкод паролей, небезопасный random и т.п.
#   5) docker build — Dockerfile собирается, а образ запускается:
#      entrypoint отрабатывает, код бота импортируется, а пользователь bot
#      может писать в /data на именованном volume (права тома).
#      На изменениях только документации (*.md, docs/) образ не собирается.
#
# Все actions закреплены по commit SHA с комментарием версии: перетирание
# тега vN не может подменить код, который выполняется в CI.

name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest + security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # политика пинов: action по тегу/ветке может быть подменён в любой
      # момент, поэтому новые uses: принимаем только с 40-символьным SHA.
      # Проверка дешёвая, поэтому до установки зависимостей — падает быстро.
      - name: Check actions are pinned to commit SHA
        run: |
          set -eu
          failed=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            lineno=0
            while IFS= read -r raw || [ -n "$raw" ]; do
              lineno=$((lineno + 1))
              # только настоящие step-level uses: ("uses:" или "- uses:"),
              # а не упоминания в комментариях и в тексте этого скрипта
              printf '%s' "$raw" | grep -Eq '^[[:space:]]*(-[[:space:]]+)?uses:' || continue
              # отрезаем комментарий, отступ, «- » и префикс — остаётся owner/repo@ref
              ref="$(printf '%s' "$raw" | sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/^-[[:space:]]*//' -e 's/^uses:[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -n "$ref" ] || continue
              # локальный action (./path) — не из реестра, пинить нечего
              case "$ref" in
                ./*) continue ;;
              esac
              if ! printf '%s' "$ref" | grep -Eq '^[^@]+@[0-9a-f]{40}$'; then
                echo "::error file=$f,line=$lineno::uses: $ref — нужен commit SHA, а не тег/ветка"
                failed=$((failed + 1))
              fi
            done < "$f"
          done
          if [ "$failed" -ne 0 ]; then
            echo "Незакреплённых actions: $failed. Укажите 40-символьный SHA (Dependabot обновит его сам)."
            exit 1
          fi
          echo "OK: все uses: в .github/workflows закреплены по commit SHA."

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      # Аудит зависимостей и статический анализ безопасности — отдельными
      # шагами, чтобы в UI сразу было видно, что именно упало. --strict
      # дополнительно валит шаг, если зависимости не резолвятся.
      - name: pip-audit (dependency vulnerabilities)
        run: |
          set -eu
          if ! pip-audit -r requirements.txt --strict --progress-spinner off; then
            echo "::error::pip-audit нашёл уязвимые зависимости. Обновите пакет в requirements.txt до версии из отчёта (Fixed in) и запустите pip-audit локально."
            exit 1
          fi

      - name: bandit (security lint)
        run: |
          set -eu
          if ! bandit -r script.py quantum ai_rules.py github_sync.py \
              -x tests,__pycache__ -ll; then
            echo "::error::bandit нашёл потенциально опасный код (severity >= medium). Исправьте место из отчёта; если это ложное срабатывание — добавьте точечный # nosec BXXX с пояснением."
            exit 1
          fi

      - name: Pytest
        run: pytest -v

  # Гейт для docker. paths-ignore в GitHub Actions живёт только на уровне
  # триггеров workflow и погасил бы заодно test, поэтому «не собирать образ
  # на правках документации» делается отдельной дешёвой job'ой.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}

    steps:
      # fetch-depth: 0 — нужна история, чтобы диффить before..after
      # и origin/<base>...HEAD.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Документация = *.md в любом каталоге и docs/. Всё остальное
      # (Dockerfile, requirements.txt, script.py, .github/workflows) — повод
      # собрать образ. Пустой список изменений тоже считаем поводом.
      - name: Detect docs-only change
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -eu
          changed=""
          docs_only=false

          case "$EVENT" in
            pull_request)
              changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
              ;;
            push)
              if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                # Первый пуш ветки: before нулевой, диффить не с чем.
                changed="$(git show --pretty=format: --name-only "$AFTER")"
              elif ! changed="$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null)"; then
                # Force push: before недоступен в истории, смотрим новый коммит.
                changed="$(git show --pretty=format: --name-only "$AFTER")"
              fi
              ;;
            *)
              # Ручной запуск (workflow_dispatch): не гадаем,
              # оставляем changed пустым — ниже это значит «собираем».
              ;;
          esac

          if [ -n "$changed" ]; then
            docs_only=true
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                *.md | docs/*) ;;
                *) docs_only=false ;;
              esac
            done <<EOF
          $changed
          EOF
          fi

          echo "Изменённые файлы:"
          printf '%s\n' "${changed:-<нет>}"
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  docker:
    name: docker build
    # Образ не собираем, если тронули только документацию.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker-compose.yml ссылается на env_file: .env, поэтому создаём
      # временный из .env.example. Берём только строки KEY=VALUE:
      # служебный заголовок [TEMPLATE] и комментарии env-парсеру не нужны.
      # mkdir seed — чтобы bind mount ./seed:/seed:ro резолвился.
      - name: Validate compose file
        run: |
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.example > .env
          mkdir -p seed
          docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Сборка без push: проверяем, что Dockerfile и .dockerignore
      # согласованы (все COPY-источники на месте, образ собирается).
      # Кэш слоёв в Actions cache: слой с pip-зависимостями не
      # пересобирается, пока не менялся requirements.txt.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: quantum-bot:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke-тест: entrypoint не должен падать без /seed, а код бота и
      # модуль переноса — импортироваться внутри образа.
      - name: Smoke test image
        run: docker run --rm quantum-bot:ci python -c "import quantum.import_seed, script"

      # Права на volume: писать в /data должен пользователь bot, а не root
      # (если USER в Dockerfile сломается, шаг это поймает). Иначе SQLite
      # не создаст quantum.db — и это вылезет уже в проде.
      - name: Check /data is writable on a named volume
        run: |
          set -eu
          VOL=quantum-ci-data
          docker volume create "$VOL" >/dev/null
          trap 'docker volume rm -f "$VOL" >/dev/null 2>&1 || true' EXIT

          # Первый контейнер: Docker копирует /data из образа (rules.txt)
          # вместе с владельцем. Проверяем, что мы не root, что правила на
          # месте и что каталог доступен на запись — включая quantum.db.
          docker run --rm -v "$VOL":/data quantum-bot:ci sh -c '
            set -eu
            test "$(id -u)" != "0"
            test -f /data/rules.txt
            touch /data/ci-write-test
            python -c "import asyncio, quantum.db as d; asyncio.run(d.init_db()); asyncio.run(d.close_db())"
          '

          # Второй контейнер на том же volume: запись пережила пересоздание.
          docker run --rm -v "$VOL":/data quantum-bot:ci \
            sh -c 'test -f /data/ci-write-test'
