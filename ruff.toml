# Настройки Ruff для Quantum (TBOT).
# Задача Ruff — бесплатный быстрый линтер: ловит ошибки, которые
# обычно находит pyflakes (неиспользуемые импорты, неопределённые имена),
# плюс подборки bugbear и async.

target-version = "py312"
line-length = 120

[lint]
select = [
    "E4",    # импорты
    "E7",    # логика и выражения
    "E9",    # синтаксис
    "F",     # pyflakes
    "B",     # bugbear
    "ASYNC", # asyncio
]
ignore = [
    "E501",   # длина строк не проверяется
    "B008",   # вызовы в аргументах (os.getenv(...) и т.п.) — норма
    "B904",   # "raise ... from" не требуется
    "B017",   # assertRaises(Exception)
    "B028",   # без предупреждений
    "ASYNC109", # timeout в аргументах async-функций — осознанно (aiohttp)
    "ASYNC230", # блокирующий open() в async-коде — осознанно (мелкие JSON-файлы)
]

[lint.per-file-ignores]
# В тестах допустимы "голые" assert и assert без сообщения.
"tests/*" = ["B011", "B018"]
# Вспомогательные скрипты не обязаны проходить все проверки.
"tools/*" = ["B", "ASYNC"]
